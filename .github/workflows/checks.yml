name: Checks

on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Application tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tongjianyun/tests
      - run: node --test tongjianyun/tests/*.test.cjs

  frappe:
    name: Clean install and upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-database
        ports: ['13306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['16379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev ldap-utils libldap2-dev libsasl2-dev
      - name: Create an isolated Frappe bench
        run: bash scripts/bootstrap-bench.sh "$RUNNER_TEMP/tjy-bench"
      - name: Install, create a demo week, and verify the migration
        env:
          TJY_DB_PASSWORD: ci-database
          TJY_DB_PORT: '13306'
          TJY_REDIS_URL: redis://127.0.0.1:16379
        run: bash scripts/check-site.sh "$RUNNER_TEMP/tjy-bench"
