<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin">
  <meta name="csrf-token" content="{{ csrf_token | e }}"><title>膳食全流程 · 童健云</title>
  <link rel="icon" href="/assets/tongjianyun/images/tongjianyun-logo.svg">
  <link rel="stylesheet" href="/assets/tongjianyun/meal_scene/app.css?v=meal-flow-20260924-2">
  <script type="importmap">{"imports":{"three":"/assets/tongjianyun/campus/vendor/three.module.js"}}</script>
</head>
<body>
  <a href="#flow-nav" class="skip">跳到业务流程</a>
  <header class="topbar">
    <a class="brand" href="/tongjianyun-entry?choose=1"><img src="/assets/tongjianyun/images/tongjianyun-logo.svg" alt="童健云"><span><b>童健云</b><small>膳食全流程 · 场景工作台</small></span></a>
    <div class="filters"><label>业务日期 <input id="day" type="date" aria-label="业务日期"></label><label>餐次 <select id="meal" aria-label="餐次"><option value="breakfast">早餐</option><option value="morning_snack">早点</option><option value="lunch" selected>午餐</option><option value="afternoon_snack">午点</option><option value="dinner">晚餐</option></select></label><button id="refresh" title="刷新业务数据" aria-label="刷新业务数据">↻</button></div>
    <div class="account"><a href="/tongjianyun-entry?choose=1">切换工作空间 ↗</a><span id="user-label">膳食工作空间</span></div>
  </header>
  <main id="stage">
    <div id="canvas" role="img" aria-label="八站膳食业务示意场景，按编号1到8顺序，所有物件都有等效键盘按钮"></div>
    <div id="labels" aria-label="场景物件"></div>
    <section class="intro"><p>MEAL WORKFLOW / 从食谱到餐桌</p><h1>沿着流程，做好每一餐</h1><span>先核预计人数，再编谱采购；实际就餐在第 7 站核对。</span></section>
    <nav id="flow-nav" aria-label="按业务顺序选择" class="flow-nav"></nav>
    <div class="view-tools"><button data-view="overview" aria-pressed="true" class="active">全景</button><button data-view="top" aria-pressed="false">俯视</button><button id="labels-toggle" aria-pressed="true">标注</button><button id="fullscreen" aria-label="全屏场景">⛶</button></div>
    <div class="search"><input id="search" type="search" autocomplete="off" placeholder="找业务物件 /" aria-label="搜索业务物件"><div id="search-results" hidden></div></div>
    <div id="message" role="status" class="message">正在读取您的膳食业务…</div>
    <div id="render-status" class="render-status">正在布置膳食业务园…</div>
    <div id="fallback" hidden><h2>普通业务模式</h2><p>当前设备无法显示 3D，按编号入口仍可完成相同业务。</p></div>
    <section class="facts" id="facts" aria-label="所选餐次真实登记摘要"></section>
    <p class="scene-note"><span id="sync">尚未读取</span> · 建筑、人物、箭头均为示意；编号是业务顺序，不是完成进度。</p>
  </main>
  <dialog id="panel" aria-modal="false" aria-labelledby="panel-title">
    <header><span id="panel-number">1</span><div><small id="panel-subtitle"></small><h2 id="panel-title">食谱与营养</h2></div><button id="expand-panel" aria-label="展开业务面板">⛶</button><button id="close-panel" aria-label="关闭业务面板">×</button></header>
    <div id="panel-context" class="panel-context"></div>
    <div id="panel-body"></div>
    <footer><button id="previous-step">← 上一站</button><span id="step-position">1 / 8</span><button id="next-step">下一站 →</button></footer>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p>请启用 JavaScript，或进入<a href="/desk/tongjianyun-workbench">原业务工作台</a>。</p></noscript>
  <script type="module" src="/assets/tongjianyun/meal_scene/app.js?v=meal-flow-20260924-2"></script>
</body></html>
