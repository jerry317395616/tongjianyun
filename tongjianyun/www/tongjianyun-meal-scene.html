<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin">
  <meta name="csrf-token" content="{{ csrf_token | e }}"><title>膳食管理工作台 · 童健云</title>
  <link rel="icon" href="/assets/tongjianyun/images/tongjianyun-logo.svg">
  <link rel="stylesheet" href="/assets/tongjianyun/meal_scene/app.css?v=meal-header-20260925-1">
  <link rel="stylesheet" href="/assets/tongjianyun/meal_scene/chat.css?v=meal-chat-sse-20260925-2">
  <link rel="stylesheet" href="/assets/tongjianyun/meal_scene/views.css?v=frappe-wide-20260925-1">
</head>
<body>
  <a href="#business-canvas" class="skip">跳到业务内容</a>
  <header class="topbar">
    <a class="brand" href="/tongjianyun-entry?choose=1"><img src="/assets/tongjianyun/images/tongjianyun-logo.svg" alt="童健云"><span><b>童健云</b><small>膳食管理工作台</small></span></a>
    <div class="account"><a href="/tongjianyun-entry?choose=1">切换工作空间 ↗</a><span id="user-label">膳食工作空间</span></div>
  </header>
  <main id="stage" class="workbench">
    <section id="business-canvas" class="workbench-main" aria-label="本周膳食总览">
      <div id="view-status" role="status" hidden></div>
      <div id="recipe-workspace">
      <div class="intro"><h1>本周膳食工作</h1><span>点选周历餐次，直接告诉右侧助手需要处理什么。</span></div>
      <div id="message" role="status" class="message" hidden></div>
      <section class="week-shell" aria-labelledby="week-title">
        <div class="week-heading"><div><small>本周食谱 · 点选餐次查看</small><h2 id="week-title">正在读取本周食谱</h2><p id="week-caption">未确认的食谱和人数不会显示为已完成。</p></div></div>
        <label class="week-mobile-picker">选择日期 <select id="week-mobile-day" aria-label="周历显示日期"></select></label>
        <div id="workbench-week" class="workbench-week-grid" role="group" aria-label="本周五餐食谱"></div>
      </section>
      </div>
      <section id="business-view" aria-labelledby="view-title" hidden>
        <header class="view-heading"><div><h1 id="view-title"></h1><p id="view-subtitle"></p></div><button id="view-back" class="view-back" type="button">← 回到食谱</button></header>
        <div id="view-content"></div><div id="view-actions" class="view-actions"></div><p id="view-source" class="view-source"></p>
      </section>
    </section>
    <aside id="meal-chat" class="meal-chat" aria-labelledby="chat-title">
      <header class="meal-chat-header"><div><h2 id="chat-title">项目与业务助手</h2><p id="chat-context">正在读取业务日期…</p></div></header>
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions">
        <div class="chat-message assistant">你好，直接说要处理哪个项目或业务。可以查看全部业务，也可以上传文件。</div>
      </div>
      <form id="chat-form" class="chat-form">
        <div id="chat-file-chip" class="chat-file-chip" hidden><span id="chat-file-name"></span><button id="chat-remove-file" type="button" aria-label="移除所选文件">×</button></div>
        <div class="chat-composer"><label class="chat-attach" for="chat-file" title="上传业务文件" aria-label="上传业务文件">＋</label><input id="chat-file" type="file" accept=".xlsx,.xls,.csv,.txt,.pdf,.png,.jpg,.jpeg" hidden><textarea id="chat-input" rows="1" maxlength="2000" placeholder="说出项目或业务需求…" aria-label="给项目与业务助手发送消息"></textarea><button id="chat-send" type="submit" aria-label="发送消息">↑</button></div>
      </form>
    </aside>
    <div hidden aria-hidden="true"><dialog id="panel" open aria-modal="false" aria-labelledby="panel-title">
      <header><span id="panel-number">1</span><div><small id="panel-subtitle">当前业务环节</small><h2 id="panel-title">食谱与营养</h2></div><button id="expand-panel" aria-label="展开业务面板">展开</button><button id="close-panel" aria-label="关闭业务面板">×</button></header>
      <div id="panel-context" class="panel-context">等待业务数据</div>
      <div id="panel-body">正在读取原业务记录…</div>
      <footer><button id="previous-step">← 上一步</button><span id="step-position" class="visually-hidden">1 / 8</span><button id="next-step">下一步 →</button></footer>
    </dialog></div>
  </main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p>请启用 JavaScript，或进入<a href="/desk/tongjianyun-workbench">原业务工作台</a>。</p></noscript>
  <script type="module" src="/assets/tongjianyun/meal_scene/app.js?v=meal-header-20260925-1"></script>
  <script type="module" src="/assets/tongjianyun/meal_scene/chat.js?v=meal-header-20260925-1"></script>
</body></html>
