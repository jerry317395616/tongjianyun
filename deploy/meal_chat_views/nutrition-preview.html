<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel 版式营养视图 · 合成数据预览</title>
<link rel="stylesheet" href="../../tongjianyun/public/meal_scene/app.css">
<link rel="stylesheet" href="../../tongjianyun/public/meal_scene/chat.css">
<link rel="stylesheet" href="../../tongjianyun/public/meal_scene/views.css">
</head><body>
<header class="topbar"><div class="brand"><img src="../../tongjianyun/public/images/tongjianyun-logo.svg" alt="童健云"><span><b>童健云</b><small>统一业务工作台</small></span></div><small>合成数据预览 · 不连接生产业务</small></header>
<main id="stage" class="workbench"><section id="business-canvas" class="workbench-main"><p id="view-status" hidden></p><section id="recipe-workspace" hidden></section>
<section id="business-view"><header class="view-heading"><div><h1 id="view-title">周食谱营养分析</h1><p id="view-subtitle">合成食谱 · 2026-09-21 — 2026-09-25 · 园内目标 80%</p></div><button id="view-back" class="view-back">← 回到食谱</button></header><div id="view-content"></div><div id="view-actions"></div><p id="view-source" class="view-source">合成数据，仅用于交互与布局验证，不代表真实营养结果。</p></section></section>
<aside id="meal-chat" class="meal-chat"><header class="meal-chat-header"><h2>项目与业务助手</h2></header><div class="chat-messages"><div class="chat-message assistant">已按 Excel 格式展示营养分析。食物用量、各餐分配、营养指标和结论都在同一张表里。</div></div><div class="chat-form"><div class="chat-composer"><textarea id="chat-input" aria-label="给助手发送消息" placeholder="说出需要调整的内容…"></textarea><button type="button" disabled>↑</button></div></div></aside></main>
<script type="module">
import {buildComponents} from '../../tongjianyun/public/meal_scene/views.js';
const data=await (await fetch('/nutrition-sheet-preview.json')).json();
document.getElementById('view-content').replaceChildren(buildComponents(data));
</script></body></html>
