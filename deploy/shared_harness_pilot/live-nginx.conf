worker_processes 1;
pid /home/zyd/frappe/state/harness/nginx.pid;
error_log /home/zyd/frappe/logs/harness/nginx-error.log crit;
events { worker_connections 256; }
http {
  access_log off;
  default_type application/octet-stream;
  server {
    listen 127.0.0.1:13091;
    server_name harness.myyr.top;
    # Public HTTPS terminates upstream; never expose the loopback HTTP port.
    absolute_redirect off;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    location = / { return 302 /native/; }
    location ^~ /native/ {
      proxy_pass http://127.0.0.1:13090;
      proxy_set_header Host harness.myyr.top;
      add_header Cache-Control "no-store" always;
      add_header Referrer-Policy "no-referrer" always;
    }
    location ~ ^/(assets/|plugins/|favicon\.svg$|manifest\.webmanifest$) {
      proxy_pass http://127.0.0.1:13090;
      proxy_set_header Host harness.myyr.top;
    }
    location = /employee/chat/ {
      default_type text/html;
      root /home/zyd/frappe/native-bench/apps/tongjianyun/tongjianyun/public/shared_chat;
      try_files /index.html =404;
    }
    location ~ ^/employee/chat/(chat\.css|chat\.mjs|client\.mjs)$ {
      types { text/css css; application/javascript mjs; }
      alias /home/zyd/frappe/native-bench/apps/tongjianyun/tongjianyun/public/shared_chat/$1;
    }
    location = /sso {
      rewrite ^ /employee/sso break;
      proxy_pass http://127.0.0.1:13090;
      proxy_set_header Host harness.myyr.top;
      proxy_redirect /employee/status /native/;
    }
    location = /employee/sso {
      proxy_pass http://127.0.0.1:13090;
      proxy_set_header Host harness.myyr.top;
      proxy_redirect /employee/status /native/;
    }
    location = /employee/session/prompt {
      proxy_buffering off;
      client_max_body_size 800000;
      proxy_pass http://127.0.0.1:13090;
      proxy_set_header Host harness.myyr.top;
      proxy_read_timeout 620s;
    }
    location ~ ^/employee/(status|logout|session/(create|list|page|read|capabilities|review|confirm))$ {
      proxy_pass http://127.0.0.1:13090;
      proxy_set_header Host harness.myyr.top;
      proxy_read_timeout 100s;
    }
    location / { return 404; }
  }
}
