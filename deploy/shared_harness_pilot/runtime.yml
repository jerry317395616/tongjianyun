# Last overlay after employee-readonly and employee-shared. No maintenance home.
- id: credentials
  config:
    path: /home/zyd/deepseek-harness-config/qwen-credentials.yaml
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  disabled: false
  config:
    providers:
      qwen:
        displayName: Qwen Server
        api: openai-completions
        baseURL: http://172.18.112.42:1234/v1
        apiKeyEnv: QWEN_API_KEY
        models:
          - id: qwen3.6-35b-a3b-fp8
            input: [text, image]
            contextWindow: 8192
            maxTokens: 1024
- id: agent-default-model
  config:
    provider: qwen
    model: qwen3.6-35b-a3b-fp8
# Foundation only, settings management remains disabled by employee-readonly.
- id: ui-settings
  disabled: false
